<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>TCQT · Zygisk</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
    <header class="page-header"><h1>TCQT</h1><span class="subtitle">Zygisk</span></header>
    <p id="error" role="alert" hidden></p>
    <section class="panel" aria-labelledby="info-title">
        <div class="section-heading"><h2 id="info-title">基本信息</h2><button id="share" class="primary" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16v4H4zM5 10v10h14V10M12 9v8m-3-3 3 3 3-3"/></svg><span id="share-label">导出日志</span></button></div>
        <div class="info-row"><strong>TCQT</strong><span>QQ / TIM · Zygisk 模块管理</span></div>
    </section>
    <section class="panel" aria-labelledby="scope-title">
        <div class="section-heading"><h2 id="scope-title">应用作用域</h2><button id="reload" class="icon-button" aria-label="刷新状态" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M19 12a7 7 0 1 0-2 5M20 12l-3-5"/></svg></button></div>
        <div id="users-section" class="user-row" hidden><label for="users">当前用户</label><select id="users"></select></div>
        <div class="preferences">
            <label class="preference"><span><strong>QQ</strong></span><small id="qq-status" class="badge">尚未读取</small><input type="checkbox" role="switch" data-key="qq" aria-describedby="qq-status" disabled></label>
            <label class="preference"><span><strong>TIM</strong></span><small id="tim-status" class="badge">尚未读取</small><input type="checkbox" role="switch" data-key="tim" aria-describedby="tim-status" disabled></label>
        </div>
        <p class="hint">修改后重启对应应用生效。请勿与 LSPosed 中的 TCQT 同时启用。</p>
    </section>
    <section class="panel" aria-labelledby="native-title">
        <div class="section-heading"><h2 id="native-title">原生 Hook</h2></div>
        <div class="preferences">
            <label class="preference"><span><strong>QQ · fopen 重定向</strong><small>在 MSF 进程中将 smaps 检测重定向至 /dev/null</small></span><input type="checkbox" role="switch" data-key="qqHook" disabled></label>
            <label class="preference"><span><strong>TIM · fopen 重定向</strong><small>在 MSF 进程中将 smaps 检测重定向至 /dev/null</small></span><input type="checkbox" role="switch" data-key="timHook" disabled></label>
        </div>
        <p class="hint">原生 Hook 随当前 Android 用户分别保存。</p>
    </section>
    <section class="panel" aria-labelledby="settings-title">
        <div class="section-heading"><h2 id="settings-title">设置</h2></div>
        <div class="preferences">
            <label class="preference"><span><strong>兼容模式</strong><small>不知道有什么用，开启后对所有用户生效</small></span><input type="checkbox" role="switch" data-key="compat" disabled></label>
            <label class="preference"><span><strong>详细调试日志</strong><small>额外记录 ART Hook 等细节，复现问题后可关闭。对所有用户生效</small></span><input type="checkbox" role="switch" data-key="debug" disabled></label>
        </div>
    </section>
    <nav class="project-links" aria-label="项目链接">
        <button type="button" data-link="source">开源地址</button>
        <button type="button" data-link="channel">构建频道</button>
        <button type="button" data-link="group">反馈群组</button>
    </nav>
</main>
<script type="module" src="view.js"></script>
</body>
</html>
