name: Regression checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests, lint and debug build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.4.1
      - name: Install pinned Android tools
        shell: bash
        run: bash tools/prepare-android-sdk.sh
      - name: Run regression gates
        run: ./gradlew :libs:core:test :libs:processor:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --configuration-cache --refresh-dependencies
      - name: Verify debug package
        run: |
          apk_file=$(find app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)
          raw_file=$(find app/build/intermediates/apk/debug/packageDebug -name '*.apk' -type f -print -quit)
          python3 tools/verify-dual-apk.py "$apk_file" --raw "$raw_file"
          unzip -tq "$apk_file"
      - name: Compile KSP registration fixtures
        run: python3 tools/test-action-processor.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-check-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.*
            libs/processor/build/reports/tests/
            libs/processor/build/test-results/
            libs/core/build/reports/tests/
            libs/core/build/test-results/
            app/build/refactor-validation/processor-fixture/*.log
          if-no-files-found: ignore
  native:
    name: Linux native IPC regressions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compile and test native IPC
        run: bash tools/test-native-host.sh
